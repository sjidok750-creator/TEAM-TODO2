    <rect x="252" y="452" width="52" height="52" rx="10"/><rect x="330" y="452" width="52" height="52" rx="10"/><rect x="408" y="452" width="52" height="52" rx="10"/><rect x="486" y="452" width="52" height="52" rx="10"/><rect x="564" y="452" width="52" height="52" rx="10"/><rect x="642" y="452" width="52" height="52" rx="10"/><rect x="720" y="452" width="52" height="52" rx="10"/>
    <rect x="252" y="532" width="52" height="52" rx="10"/><rect x="330" y="532" width="52" height="52" rx="10"/><rect x="408" y="532" width="52" height="52" rx="10"/>                                                    <rect x="564" y="532" width="52" height="52" rx="10"/><rect x="642" y="532" width="52" height="52" rx="10"/><rect x="720" y="532" width="52" height="52" rx="10"/>
    <rect x="252" y="612" width="52" height="52" rx="10"/><rect x="330" y="612" width="52" height="52" rx="10"/><rect x="408" y="612" width="52" height="52" rx="10"/><rect x="486" y="612" width="52" height="52" rx="10"/><rect x="564" y="612" width="52" height="52" rx="10"/>
